                <script>
                    $(document).ready(function () {
                        $(".services-1.our-services .news-card").on("mouseenter touchstart", function (event) {
                            event.stopPropagation();

                            // Hide other overlays before showing current one
                            $(".overlay").stop().animate({ bottom: "-100%", opacity: "0" }, 300);

                            $(this).find(".overlay").stop().css({ bottom: "-100%", opacity: "0" }).animate(
                                { bottom: "0", opacity: "1" },
                                { duration: 500 }
                            );
                            $(this).find(".news-text").stop().animate(
                                { bottom: "70%" }, 500
                            );
                        });

                        // Hide overlay on mouseleave but keep text visible
                        $(".services-1.our-services .news-card").on("mouseleave", function () {
                            $(this).find(".overlay").stop().animate({ bottom: "-100%", opacity: "0" }, 300);
                            $(this).find(".news-text").stop().animate({ bottom: "0px" }, 300); // Keep text visible at bottom
                        });

                        // Tap outside to hide overlay (for mobile)
                        $(document).on("click touchstart", function (event) {
                            if (!$(event.target).closest(".services-1.our-services .news-card").length) {
                                $(".overlay").stop().animate({ bottom: "-100%", opacity: "0" }, 300);
                            }
                        });

                        // Prevent iOS double-tap zoom issue
                        $(".services-1.our-services .news-card").on("touchend", function (event) {
                            event.preventDefault();
                        });
                    });

        $(function () {
            /* Start code to load js and css files properly on local server or production server: NOte: this is the workwround, need to fix this */
            loadHeaderFooter("header", "/media/projects/lei53512/lei53512/header.html");
            loadHeaderFooter("footer", "/media/projects/lei53512/lei53512/footer.html");
            /*  End code */
            /*  Start code to load js and css files properly on Githubpages  */
            loadHeaderFooter("header", "header.html");
            loadHeaderFooter("footer", "footer.html");
            /* End code */
            function getCurrentFile() {
                let file = new URLSearchParams(location.search).get("srcReq") ||
                    location.pathname.split("/").pop() ||
                    "index.html";
                if (!file.includes(".")) file += ".html";
                return file.toLowerCase();
            }

            function loadHeaderFooter(id, file) {
                $("#" + id).load(file, function (_, status) {
                    if (status === "error") return;
                    const targetid = $("#" + id);
                    targetid.find("a").addClass("edit-site");
                    if (id !== "header") return;
                    let current = getCurrentFile();
                    // Show / hide sections
                    targetid.find(".main-header-section").toggle(current === "index.html");
                    targetid.find(".header-breadcrumb-section").toggle(current !== "index.html");
                    // Match page name
                    let name = "";
                    targetid.find(".main-navigation a").each(function () {
                        let href = ($(this).attr("href") || "").split("/").pop().toLowerCase();
                        if (href === current) name = $(this).text().trim();
                    });
                    // Apply name (fallback safe)
                    targetid.find(".Page_name").text(
                        name || current.replace(".html", "").replace(/_/g, " ")
                    );
                });
            }
        });
    </script>
